
name: PIXEL RUNNER iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Check files
        run: |
          test -f PixelRunner/PixelRunnerApp.swift
          test -f PixelRunner/GameScene.swift
          test -f project.yml

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          test -d PixelRunner.xcodeproj
          xcodebuild -list -project PixelRunner.xcodeproj

      - name: Build iOS app
        run: |
          xcodebuild \
            -project PixelRunner.xcodeproj \
            -scheme PixelRunner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify app
        run: |
          test -d build/Build/Products/Release-iphoneos/PixelRunner.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PixelRunner.app Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload PixelRunner.ipa
          test -s PixelRunner.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PIXEL-RUNNER-IPA
          path: PixelRunner.ipa
          if-no-files-found: error
          retention-days: 7
